name: Bug report
description: Something is broken or behaves unexpectedly
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Please fill in the sections below so we can reproduce the issue.
  - type: input
    id: extension-version
    attributes:
      label: Extension version
      description: Version from chrome://extensions or package.json
      placeholder: "1.0.0"
    validations:
      required: true
  - type: input
    id: chrome-version
    attributes:
      label: Chrome version
      description: From chrome://version
      placeholder: "131.0.x"
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Minimal steps that trigger the bug
      placeholder: |
        1. Load QuietReplay unpacked
        2. Open example.com
        3. Press Alt+Shift+R …
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Include relevant console / service worker logs
    validations:
      required: true
