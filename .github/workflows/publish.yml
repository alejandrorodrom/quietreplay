name: Publish extension release

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "If true, run checks and build only (no tag / GitHub Release)"
        required: false
        type: boolean
        default: false

# Least privilege at workflow level; write scopes only on the publish job.
permissions:
  contents: read

concurrency:
  group: extension-publish-${{ github.repository }}
  cancel-in-progress: false

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml

  e2e:
    name: E2E
    uses: ./.github/workflows/e2e.yml

  npm-audit:
    name: npm audit
    uses: ./.github/workflows/npm-audit.yml

  publish:
    name: Publish
    needs: [ci, e2e, npm-audit]
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 1

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build zip
        run: pnpm run zip

      - name: Resolve zip path
        id: zip
        run: |
          set -euo pipefail
          ZIP="$(ls .output/*.zip web-ext-artifacts/*.zip 2>/dev/null | head -n1)"
          if [ -z "${ZIP}" ]; then
            echo "No extension zip found" >&2
            exit 1
          fi
          echo "path=${ZIP}" >> "$GITHUB_OUTPUT"
          echo "name=$(basename "${ZIP}")" >> "$GITHUB_OUTPUT"

      - name: Generate SBOM
        uses: anchore/sbom-action@dfcb83b97731532d72be422cbc51ee64adb6fd56 # v0.24.4
        with:
          path: .
          format: spdx-json
          output-file: quietreplay.spdx.json
          upload-artifact: false
          upload-release-assets: false


      - name: Attest build provenance
        id: attest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ steps.zip.outputs.path }}

      - name: Materialize attestation for release assets
        if: ${{ !inputs.dry_run }}
        env:
          BUNDLE_PATH: ${{ steps.attest.outputs.bundle-path }}
        run: |
          set -euo pipefail
          cp "${BUNDLE_PATH}" "./${{ steps.zip.outputs.name }}.sigstore.json"
          # Scorecard Signed-Releases looks for *.intoto.jsonl among release assets.
          cp "${BUNDLE_PATH}" "./${{ steps.zip.outputs.name }}.intoto.jsonl"

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: quietreplay-extension
          path: |
            ${{ steps.zip.outputs.path }}
            quietreplay.spdx.json

      - name: Create tag and GitHub Release
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ github.token }}
          ZIP_PATH: ${{ steps.zip.outputs.path }}
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./package.json').version")"
          TAG="v${VERSION}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --tags origin "refs/tags/$TAG" | grep -q .; then
            echo "Tag $TAG already exists on origin."
            exit 0
          fi
          git tag -a "$TAG" -m "Release $TAG"
          git push origin "$TAG"
          gh release create "$TAG" \
            "$ZIP_PATH" \
            quietreplay.spdx.json \
            "./$(basename "$ZIP_PATH").sigstore.json" \
            "./$(basename "$ZIP_PATH").intoto.jsonl" \
            --title "$TAG" \
            --notes "QuietReplay $VERSION — see CHANGELOG.md

          ## Verify provenance

          \`\`\`bash
          gh attestation verify --repo alejandrorodrom/quietreplay ./$(basename "$ZIP_PATH")
          \`\`\`"
