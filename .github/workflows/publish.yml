name: Publish extension release

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "If true, run checks and build only (no tag / GitHub Release / store upload)"
        required: false
        type: boolean
        default: false
      upload_chrome:
        description: "Chrome path: upload ZIP as draft (and print status)"
        required: false
        type: boolean
        default: true
      upload_edge:
        description: "Edge path: upload ZIP as draft (and submit if publish_stores)"
        required: false
        type: boolean
        default: true
      publish_stores:
        description: "After upload: Chrome publish + Edge certification submit"
        required: false
        type: boolean
        default: false
      check_status:
        description: "Only check/report store status (Chrome: API status; Edge: reminder — no read-only review API)"
        required: false
        type: boolean
        default: false
      force_upload:
        description: "If a store is in review: Chrome still uploads; Edge warns and does not fail the job"
        required: false
        type: boolean
        default: false

# Least privilege at workflow level; write scopes only where needed.
permissions:
  contents: read

concurrency:
  group: extension-publish-${{ github.repository }}
  cancel-in-progress: false

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml

  e2e:
    name: E2E
    uses: ./.github/workflows/e2e.yml

  npm-audit:
    name: npm audit
    uses: ./.github/workflows/npm-audit.yml

  prepare:
    name: Build & release
    needs: [ci, e2e, npm-audit]
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: write
      id-token: write
      attestations: write
    outputs:
      zip_name: ${{ steps.zip.outputs.name }}
      version: ${{ steps.zip.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build zip
        run: pnpm run zip

      - name: Resolve zip path
        id: zip
        run: |
          set -euo pipefail
          ZIP="$(find .output web-ext-artifacts -maxdepth 1 -type f -name '*.zip' 2>/dev/null | sort | tail -n1 || true)"
          if [ -z "${ZIP}" ]; then
            echo "No extension zip found" >&2
            find .output -maxdepth 2 -type f 2>/dev/null | head -n50 >&2 || true
            exit 1
          fi
          echo "path=${ZIP}" >> "$GITHUB_OUTPUT"
          echo "name=$(basename "${ZIP}")" >> "$GITHUB_OUTPUT"
          echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Generate SBOM
        uses: anchore/sbom-action@dfcb83b97731532d72be422cbc51ee64adb6fd56 # v0.24.4
        with:
          path: .
          format: spdx-json
          output-file: quietreplay.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Attest build provenance
        id: attest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ steps.zip.outputs.path }}

      - name: Materialize attestation for release assets
        if: ${{ !inputs.dry_run }}
        env:
          BUNDLE_PATH: ${{ steps.attest.outputs.bundle-path }}
        run: |
          set -euo pipefail
          cp "${BUNDLE_PATH}" "./${{ steps.zip.outputs.name }}.sigstore.json"
          cp "${BUNDLE_PATH}" "./${{ steps.zip.outputs.name }}.intoto.jsonl"

      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: quietreplay-extension
          path: |
            ${{ steps.zip.outputs.path }}
            quietreplay.spdx.json
          if-no-files-found: error

      - name: Create tag and GitHub Release
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ github.token }}
          ZIP_PATH: ${{ steps.zip.outputs.path }}
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./package.json').version")"
          TAG="v${VERSION}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --tags origin "refs/tags/$TAG" | grep -q .; then
            echo "Tag $TAG already exists on origin."
            exit 0
          fi
          git tag -a "$TAG" -m "Release $TAG"
          git push origin "$TAG"
          gh release create "$TAG" \
            "$ZIP_PATH" \
            quietreplay.spdx.json \
            "./$(basename "$ZIP_PATH").sigstore.json" \
            "./$(basename "$ZIP_PATH").intoto.jsonl" \
            --title "$TAG" \
            --notes "QuietReplay $VERSION — see CHANGELOG.md

          ## Verify provenance

          \`\`\`bash
          gh attestation verify --repo alejandrorodrom/quietreplay ./$(basename "$ZIP_PATH")
          \`\`\`"

  chrome:
    name: Chrome Web Store
    needs: prepare
    if: ${{ !inputs.dry_run && (inputs.upload_chrome || inputs.check_status) }}
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download zip artifact
        if: ${{ inputs.upload_chrome }}
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: quietreplay-extension
          path: dist-upload

      - name: Resolve zip path
        if: ${{ inputs.upload_chrome }}
        id: zip
        run: |
          set -euo pipefail
          ZIP="$(find dist-upload -type f -name '*.zip' | sort | tail -n1)"
          if [ -z "${ZIP}" ]; then
            echo "No zip in artifact" >&2
            exit 1
          fi
          echo "path=${ZIP}" >> "$GITHUB_OUTPUT"

      - name: Require Chrome Web Store secrets
        env:
          CHROME_CLIENT_ID: ${{ secrets.CHROME_CLIENT_ID }}
          CHROME_CLIENT_SECRET: ${{ secrets.CHROME_CLIENT_SECRET }}
          CHROME_REFRESH_TOKEN: ${{ secrets.CHROME_REFRESH_TOKEN }}
          CHROME_EXTENSION_ID: ${{ secrets.CHROME_EXTENSION_ID }}
          CHROME_PUBLISHER_ID: ${{ secrets.CHROME_PUBLISHER_ID }}
        run: |
          set -euo pipefail
          missing=0
          for name in CHROME_CLIENT_ID CHROME_CLIENT_SECRET CHROME_REFRESH_TOKEN CHROME_EXTENSION_ID CHROME_PUBLISHER_ID; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing secret $name in the production environment."
              missing=1
            fi
          done
          exit "$missing"

      - name: Chrome status (before)
        id: chrome_status
        env:
          CLIENT_ID: ${{ secrets.CHROME_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CHROME_CLIENT_SECRET }}
          REFRESH_TOKEN: ${{ secrets.CHROME_REFRESH_TOKEN }}
          EXTENSION_ID: ${{ secrets.CHROME_EXTENSION_ID }}
          PUBLISHER_ID: ${{ secrets.CHROME_PUBLISHER_ID }}
          ZIP_PATH: ${{ steps.zip.outputs.path }}
          FAIL_IF_PENDING: ${{ inputs.upload_chrome && !inputs.force_upload && '1' || '0' }}
          FAIL_IF_SAME_VERSION: ${{ inputs.upload_chrome && !inputs.force_upload && '1' || '0' }}
        run: |
          set -euo pipefail
          pnpm exec tsx scripts/chrome-webstore-status.ts
          PUBLISHED="$(awk -F= '/^published_state=/{print $2}' "$GITHUB_OUTPUT" | tail -n1)"
          SUBMITTED="$(awk -F= '/^submitted_state=/{print $2}' "$GITHUB_OUTPUT" | tail -n1)"
          PUB_VER="$(awk -F= '/^published_version=/{print $2}' "$GITHUB_OUTPUT" | tail -n1)"
          SUB_VER="$(awk -F= '/^submitted_version=/{print $2}' "$GITHUB_OUTPUT" | tail -n1)"
          PKG_VER="$(awk -F= '/^package_version=/{print $2}' "$GITHUB_OUTPUT" | tail -n1)"
          {
            echo "## Chrome Web Store"
            echo ""
            echo "- published: \`${PUBLISHED:-none}\`${PUB_VER:+ (v$PUB_VER)}"
            echo "- submitted: \`${SUBMITTED:-none}\`${SUB_VER:+ (v$SUB_VER)}"
            echo "- package: \`${PKG_VER:-n/a}\`"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "${SUBMITTED}" = "PENDING_REVIEW" ]; then
            echo "::warning title=Chrome in review::Submitted revision is PENDING_REVIEW. Wait, or re-run with force_upload=true."
            echo "- **In review** (\`PENDING_REVIEW\`). Use \`force_upload\` to upload anyway." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload to Chrome Web Store (draft)
        if: ${{ inputs.upload_chrome }}
        env:
          CLIENT_ID: ${{ secrets.CHROME_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CHROME_CLIENT_SECRET }}
          REFRESH_TOKEN: ${{ secrets.CHROME_REFRESH_TOKEN }}
          EXTENSION_ID: ${{ secrets.CHROME_EXTENSION_ID }}
          PUBLISHER_ID: ${{ secrets.CHROME_PUBLISHER_ID }}
          ZIP_PATH: ${{ steps.zip.outputs.path }}
        run: |
          set -euo pipefail
          pnpm dlx chrome-webstore-upload-cli@4 upload \
            --source "$ZIP_PATH" \
            --extension-id "$EXTENSION_ID" \
            --publisher-id "$PUBLISHER_ID"

      - name: Publish Chrome Web Store draft
        if: ${{ inputs.upload_chrome && inputs.publish_stores }}
        env:
          CLIENT_ID: ${{ secrets.CHROME_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CHROME_CLIENT_SECRET }}
          REFRESH_TOKEN: ${{ secrets.CHROME_REFRESH_TOKEN }}
          EXTENSION_ID: ${{ secrets.CHROME_EXTENSION_ID }}
          PUBLISHER_ID: ${{ secrets.CHROME_PUBLISHER_ID }}
        run: |
          set -euo pipefail
          pnpm dlx chrome-webstore-upload-cli@4 publish \
            --extension-id "$EXTENSION_ID" \
            --publisher-id "$PUBLISHER_ID"

      - name: Chrome status (after)
        if: ${{ inputs.upload_chrome }}
        env:
          CLIENT_ID: ${{ secrets.CHROME_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CHROME_CLIENT_SECRET }}
          REFRESH_TOKEN: ${{ secrets.CHROME_REFRESH_TOKEN }}
          EXTENSION_ID: ${{ secrets.CHROME_EXTENSION_ID }}
          PUBLISHER_ID: ${{ secrets.CHROME_PUBLISHER_ID }}
        run: |
          set -euo pipefail
          pnpm exec tsx scripts/chrome-webstore-status.ts

  edge:
    name: Edge Add-ons
    needs: prepare
    if: ${{ !inputs.dry_run && (inputs.upload_edge || inputs.check_status) }}
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Require Edge Add-ons secrets
        if: ${{ inputs.upload_edge || inputs.check_status }}
        env:
          EDGE_CLIENT_ID: ${{ secrets.EDGE_CLIENT_ID }}
          EDGE_API_KEY: ${{ secrets.EDGE_API_KEY }}
          EDGE_PRODUCT_ID: ${{ secrets.EDGE_PRODUCT_ID }}
        run: |
          set -euo pipefail
          missing=0
          for name in EDGE_CLIENT_ID EDGE_API_KEY EDGE_PRODUCT_ID; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing secret $name in the production environment."
              missing=1
            fi
          done
          exit "$missing"

      - name: Edge status (In review probe)
        if: ${{ inputs.check_status && !inputs.upload_edge }}
        env:
          EDGE_API_KEY: ${{ secrets.EDGE_API_KEY }}
          EDGE_CLIENT_ID: ${{ secrets.EDGE_CLIENT_ID }}
          EDGE_PRODUCT_ID: ${{ secrets.EDGE_PRODUCT_ID }}
          MODE: status
          FORCE: ${{ inputs.force_upload && '1' || '0' }}
        run: |
          set -euo pipefail
          pnpm exec tsx scripts/edge-addons-publish.ts
          {
            echo "## Edge Add-ons"
            echo ""
            echo "- Probed Partner Center via publish API (\`InProgressSubmission\` = **In review**)."
            echo "- UI may also show **UPDATE In draft** beside **In review** — that is expected."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Download zip artifact
        if: ${{ inputs.upload_edge }}
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: quietreplay-extension
          path: dist-upload

      - name: Resolve zip path
        if: ${{ inputs.upload_edge }}
        id: zip
        run: |
          set -euo pipefail
          ZIP="$(find dist-upload -type f -name '*.zip' | sort | tail -n1)"
          if [ -z "${ZIP}" ]; then
            echo "No zip in artifact" >&2
            exit 1
          fi
          echo "path=${ZIP}" >> "$GITHUB_OUTPUT"

      - name: Upload / submit Edge Add-ons
        if: ${{ inputs.upload_edge }}
        env:
          EDGE_API_KEY: ${{ secrets.EDGE_API_KEY }}
          EDGE_CLIENT_ID: ${{ secrets.EDGE_CLIENT_ID }}
          EDGE_PRODUCT_ID: ${{ secrets.EDGE_PRODUCT_ID }}
          EDGE_CRX_ID: ${{ secrets.EDGE_CRX_ID }}
          ZIP_PATH: ${{ steps.zip.outputs.path }}
          MODE: upload
          PUBLISH: ${{ inputs.publish_stores && '1' || '0' }}
          FORCE: ${{ inputs.force_upload && '1' || '0' }}
          FAIL_IF_SAME_VERSION: ${{ inputs.upload_edge && !inputs.force_upload && '1' || '0' }}
          CERTIFICATION_NOTES: >-
            QuietReplay update. Test: open an https page → Record → interact →
            Stop and save → check Downloads for quietreplay-*.zip. No account;
            extension uses connect-src none. UI: English and Spanish.
        run: |
          set -euo pipefail
          pnpm exec tsx scripts/edge-addons-publish.ts
          {
            echo "## Edge Add-ons"
            echo ""
            echo "- Validated **In review** via \`InProgressSubmission\` (same idea as Chrome \`PENDING_REVIEW\`)."
            echo "- Rejects ZIP when version matches the **live** store version (needs \`EDGE_CRX_ID\` secret)."
            echo "- Partner Center can show **UPDATE In draft** + **In review** at once; blocked unless \`force_upload\`."
          } >> "$GITHUB_STEP_SUMMARY"
