name: Publish extension release

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "If true, run checks and build only (no tag / GitHub Release / store upload)"
        required: false
        type: boolean
        default: false
      upload_chrome:
        description: "Upload ZIP to Chrome Web Store as a draft (requires first manual listing + secrets)"
        required: false
        type: boolean
        default: false
      upload_edge:
        description: "Upload ZIP to Edge Add-ons as a draft (requires first published listing + secrets)"
        required: false
        type: boolean
        default: false
      publish_stores:
        description: "After upload, submit Chrome for publish and Edge for certification (otherwise draft only)"
        required: false
        type: boolean
        default: false

# Least privilege at workflow level; write scopes only on the publish job.
permissions:
  contents: read

concurrency:
  group: extension-publish-${{ github.repository }}
  cancel-in-progress: false

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml

  e2e:
    name: E2E
    uses: ./.github/workflows/e2e.yml

  npm-audit:
    name: npm audit
    uses: ./.github/workflows/npm-audit.yml

  publish:
    name: Publish
    needs: [ci, e2e, npm-audit]
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build zip
        run: pnpm run zip

      - name: Resolve zip path
        id: zip
        run: |
          set -euo pipefail
          ZIP="$(ls .output/*.zip web-ext-artifacts/*.zip 2>/dev/null | head -n1)"
          if [ -z "${ZIP}" ]; then
            echo "No extension zip found" >&2
            exit 1
          fi
          echo "path=${ZIP}" >> "$GITHUB_OUTPUT"
          echo "name=$(basename "${ZIP}")" >> "$GITHUB_OUTPUT"

      - name: Generate SBOM
        uses: anchore/sbom-action@dfcb83b97731532d72be422cbc51ee64adb6fd56 # v0.24.4
        with:
          path: .
          format: spdx-json
          output-file: quietreplay.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Attest build provenance
        id: attest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ steps.zip.outputs.path }}

      - name: Materialize attestation for release assets
        if: ${{ !inputs.dry_run }}
        env:
          BUNDLE_PATH: ${{ steps.attest.outputs.bundle-path }}
        run: |
          set -euo pipefail
          cp "${BUNDLE_PATH}" "./${{ steps.zip.outputs.name }}.sigstore.json"
          # Scorecard Signed-Releases looks for *.intoto.jsonl among release assets.
          cp "${BUNDLE_PATH}" "./${{ steps.zip.outputs.name }}.intoto.jsonl"

      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: quietreplay-extension
          path: |
            ${{ steps.zip.outputs.path }}
            quietreplay.spdx.json

      - name: Create tag and GitHub Release
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ github.token }}
          ZIP_PATH: ${{ steps.zip.outputs.path }}
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./package.json').version")"
          TAG="v${VERSION}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --tags origin "refs/tags/$TAG" | grep -q .; then
            echo "Tag $TAG already exists on origin."
            exit 0
          fi
          git tag -a "$TAG" -m "Release $TAG"
          git push origin "$TAG"
          gh release create "$TAG" \
            "$ZIP_PATH" \
            quietreplay.spdx.json \
            "./$(basename "$ZIP_PATH").sigstore.json" \
            "./$(basename "$ZIP_PATH").intoto.jsonl" \
            --title "$TAG" \
            --notes "QuietReplay $VERSION — see CHANGELOG.md

          ## Verify provenance

          \`\`\`bash
          gh attestation verify --repo alejandrorodrom/quietreplay ./$(basename "$ZIP_PATH")
          \`\`\`"

      - name: Require Chrome Web Store secrets
        if: ${{ !inputs.dry_run && inputs.upload_chrome }}
        env:
          CHROME_CLIENT_ID: ${{ secrets.CHROME_CLIENT_ID }}
          CHROME_CLIENT_SECRET: ${{ secrets.CHROME_CLIENT_SECRET }}
          CHROME_REFRESH_TOKEN: ${{ secrets.CHROME_REFRESH_TOKEN }}
          CHROME_EXTENSION_ID: ${{ secrets.CHROME_EXTENSION_ID }}
          CHROME_PUBLISHER_ID: ${{ secrets.CHROME_PUBLISHER_ID }}
        run: |
          set -euo pipefail
          missing=0
          for name in CHROME_CLIENT_ID CHROME_CLIENT_SECRET CHROME_REFRESH_TOKEN CHROME_EXTENSION_ID CHROME_PUBLISHER_ID; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing secret $name in the production environment. See CHROMEWEBSTORE.md → GitHub Actions."
              missing=1
            fi
          done
          exit "$missing"

      - name: Upload to Chrome Web Store (draft)
        if: ${{ !inputs.dry_run && inputs.upload_chrome }}
        env:
          CLIENT_ID: ${{ secrets.CHROME_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CHROME_CLIENT_SECRET }}
          REFRESH_TOKEN: ${{ secrets.CHROME_REFRESH_TOKEN }}
          EXTENSION_ID: ${{ secrets.CHROME_EXTENSION_ID }}
          PUBLISHER_ID: ${{ secrets.CHROME_PUBLISHER_ID }}
          ZIP_PATH: ${{ steps.zip.outputs.path }}
        run: |
          set -euo pipefail
          pnpm dlx chrome-webstore-upload-cli@4 upload \
            --source "$ZIP_PATH" \
            --extension-id "$EXTENSION_ID" \
            --publisher-id "$PUBLISHER_ID"

      - name: Publish Chrome Web Store draft
        if: ${{ !inputs.dry_run && inputs.upload_chrome && inputs.publish_stores }}
        env:
          CLIENT_ID: ${{ secrets.CHROME_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CHROME_CLIENT_SECRET }}
          REFRESH_TOKEN: ${{ secrets.CHROME_REFRESH_TOKEN }}
          EXTENSION_ID: ${{ secrets.CHROME_EXTENSION_ID }}
          PUBLISHER_ID: ${{ secrets.CHROME_PUBLISHER_ID }}
        run: |
          set -euo pipefail
          pnpm dlx chrome-webstore-upload-cli@4 publish \
            --extension-id "$EXTENSION_ID" \
            --publisher-id "$PUBLISHER_ID"

      - name: Require Edge Add-ons secrets
        if: ${{ !inputs.dry_run && inputs.upload_edge }}
        env:
          EDGE_CLIENT_ID: ${{ secrets.EDGE_CLIENT_ID }}
          EDGE_API_KEY: ${{ secrets.EDGE_API_KEY }}
          EDGE_PRODUCT_ID: ${{ secrets.EDGE_PRODUCT_ID }}
        run: |
          set -euo pipefail
          missing=0
          for name in EDGE_CLIENT_ID EDGE_API_KEY EDGE_PRODUCT_ID; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing secret $name in the production environment. See CHROMEWEBSTORE.md → GitHub Actions."
              missing=1
            fi
          done
          exit "$missing"

      - name: Upload to Edge Add-ons
        if: ${{ !inputs.dry_run && inputs.upload_edge }}
        uses: hamzahamidi/publish-to-edge-add-ons@4efbcdd7ee5fef9612ff586e4ad4a9adda919e02 # v1.0.0
        with:
          api-key: ${{ secrets.EDGE_API_KEY }}
          client-id: ${{ secrets.EDGE_CLIENT_ID }}
          product-id: ${{ secrets.EDGE_PRODUCT_ID }}
          zip: ${{ steps.zip.outputs.path }}
          publish: ${{ inputs.publish_stores }}
          certification-notes: >-
            QuietReplay update. Test: open an https page → Record → interact →
            Stop and save → check Downloads for quietreplay-*.zip. No account;
            extension uses connect-src none. UI: English and Spanish.
