name: Publish extension release

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "If true, run checks and build only (no tag / GitHub Release)"
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  checks: write

concurrency:
  group: extension-publish-${{ github.repository }}
  cancel-in-progress: false

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml

  e2e:
    name: E2E
    uses: ./.github/workflows/e2e.yml

  npm-audit:
    name: npm audit
    uses: ./.github/workflows/npm-audit.yml

  publish:
    name: Publish
    needs: [ci, e2e, npm-audit]
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          fetch-depth: 1

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115  # v6.1.1

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build zip
        run: pnpm run zip

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: quietreplay-extension
          path: |
            .output/*.zip
            web-ext-artifacts/*.zip

      - name: Create tag and GitHub Release
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./package.json').version")"
          TAG="v${VERSION}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --tags origin "refs/tags/$TAG" | grep -q .; then
            echo "Tag $TAG already exists on origin."
            exit 0
          fi
          git tag -a "$TAG" -m "Release $TAG"
          git push origin "$TAG"
          ZIP="$(ls .output/*.zip web-ext-artifacts/*.zip 2>/dev/null | head -n1)"
          gh release create "$TAG" ${ZIP:+"$ZIP"} --title "$TAG" --notes "QuietReplay $VERSION — see CHANGELOG.md"
