name: E2E External

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: e2e-external-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e-external:
    name: E2E external (informational)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm run build

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run external e2e cases
        run: pnpm run test:e2e:external
